<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Level01 Todo App</title>

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="app">
    <h1 class="title">
      Neo<span>Task</span>
    </h1>

    <div class="input-group">
      <input
        type="text"
        class="todo-input"
        placeholder="Add a task..."
      />

      <button class="add-btn">
        Add
      </button>
    </div>

    <div class="todo-list">
      <div class="empty">
        No tasks yet
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
